syntax = "proto3";

package auth;

import "google/protobuf/empty.proto";

option go_package = "./internal/pkg/auth/delivery/grpc/gen";

service AuthService {
  rpc SignIn (SignInRequest) returns (UserResponse) {}

  rpc GetQRCode (GetQRCodeRequest) returns (google.protobuf.Empty) {}

  rpc CheckCode (CheckCodeRequest) returns (CheckCodeResponse) {}

  rpc Disable2Fa (Disable2FaRequest) returns (google.protobuf.Empty) {}
  
  rpc SignUp (SignUpRequest) returns (UserResponse) {}
  
  rpc Check (CheckRequest) returns (UserResponse) {}
    
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse) {}
  
  rpc UpdateUserPic (UpdateUserPicRequest) returns (UserResponse) {}
  
  rpc GetUserAddresses (AddressRequest) returns (AddressListResponse) {}
  
  rpc DeleteAddress (DeleteAddressRequest) returns (google.protobuf.Empty) {}
  
  rpc AddAddress (Address) returns (google.protobuf.Empty) {}
}

message CheckRequest {
  string Login = 1;
}

message AddressRequest {
  string Login = 1;
}

message SignInRequest {
  string Login = 1;
  string Password = 2;
}

message GetQRCodeRequest {
  string Login = 1;
  bytes Secret2fa = 2;
}

message CheckCodeRequest {
  string Login = 1;
}

message Disable2FaRequest {
  string Login = 1;
}

message SignUpRequest {
  string Login = 1;
  string FirstName = 2;
  string LastName = 3;
  string PhoneNumber = 4;
  string Password = 5;
}

message UpdateUserRequest {
  string Login = 1;
  string Description = 2;
  string FirstName = 3;
  string LastName = 4;
  string PhoneNumber = 5;
  string Password = 6;
}

message UpdateUserPicRequest {
  string login = 1;
  bytes user_pic = 2; 
  string file_extension = 3;
}

message DeleteAddressRequest {
  string Id = 1; 
}

message Address {
  string Id = 1; 
  string Address = 2;
  string UserId = 3; 
  bool IsActive = 4;
}

message UserResponse {
  string Login = 1;
  string PhoneNumber = 2;
  string Id = 3; 
  string FirstName = 4;
  string LastName = 5;
  string Description = 6;
  string UserPic = 7; 
  string Token = 8;
  string CsrfToken = 9;
  string ActiveAddress = 10;
  bool HasSecret = 11;
}

message CheckCodeResponse {
  bytes Secret2fa = 1;
}

message AddressListResponse {
  repeated Address Addresses = 1;
}
